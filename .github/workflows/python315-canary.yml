name: Python 3.15 dependency canary

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python315-dependency-canary
  cancel-in-progress: true

jobs:
  core-dependencies:
    name: Core dependency probe on Python 3.15
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Extract current core dependency requirements
        run: >-
          python -c 'import tomllib; from pathlib import Path;
          data = tomllib.loads(Path("pyproject.toml").read_text());
          Path("python315-core.txt").write_text("\n".join(data["project"]["dependencies"]) + "\n")'

      - name: Run the focused source canary
        env:
          PYTHONPATH: src
        run: >-
          uv run --isolated --no-project --python 3.15
          --with-requirements python315-core.txt
          --with pytest --with pytest-asyncio --with pytest-timeout
          pytest tests/test_core_abstractions.py tests/test_storage_paths.py
          tests/test_aqr_provider.py -q
