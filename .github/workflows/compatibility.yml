name: Compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.9"

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_NO_MANAGED_PYTHON: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the complete supported environment
        run: uv sync --locked --all-extras --dev

      - name: Verify import
        run: uv run --no-sync python -c "import ml4t.data as package; print(package.__version__)"

      - name: Type-check for Python ${{ matrix.python-version }}
        run: uv run --no-sync ty check --python-version "${{ matrix.python-version }}"

      - name: Run the non-hardware-dependent test suite
        run: uv run --no-sync pytest tests/ -q --tb=short -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning

      - name: Build wheel and source distribution
        run: uv build --out-dir compatibility-dist

      - name: Verify isolated wheel and source installs
        run: uv run --no-sync python scripts/verify_distribution.py --dist-dir compatibility-dist
