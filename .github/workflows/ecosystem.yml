name: Ecosystem qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@736599a738747dcf1e874a4e552ca018c0057cab # v0.1.0
    with:
      import-package: ml4t.data
