name: Bug report
description: Report reproducible incorrect behavior in ml4t-data
title: "[Bug]: "
labels:
  - "type: bug"
  - "priority: normal"
  - "status: needs-triage"
  - "compatibility: affected"
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Report one problem per issue and use separate issues for
        unrelated problems. Read the
        [shared contribution policy](https://github.com/ml4t/ecosystem/blob/main/CONTRIBUTING.md)
        before submitting. Do not disclose suspected vulnerabilities here.
  - type: input
    id: version
    attributes:
      label: Affected package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Include Python version, operating system, installation method, and relevant extras.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest complete public API or user workflow and its error output.
    validations:
      required: true
  - type: dropdown
    id: numerical
    attributes:
      label: Numerical impact
      options:
        - Produces an incorrect numerical result
        - Changes a documented definition or convention
        - No known numerical impact
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - Public behavior or results
        - Python or operating-system support
        - Cross-library contract
        - Installation or dependency resolution
        - No known compatibility impact
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the observable conditions that demonstrate the issue is resolved.
    validations:
      required: true
