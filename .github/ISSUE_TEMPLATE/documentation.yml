name: Documentation problem
description: Report missing, incorrect, or difficult documentation
title: "[Docs]: "
labels:
  - "type: documentation"
  - "priority: normal"
  - "status: needs-triage"
  - "compatibility: none"
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Report one documentation problem per issue and separate
        unrelated changes. Read the
        [shared contribution policy](https://github.com/ml4t/ecosystem/blob/main/CONTRIBUTING.md)
        before submitting.
  - type: input
    id: version
    attributes:
      label: Package or documentation version
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or API location
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State what is missing, incorrect, or difficult to follow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Required documentation outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
