# ML4T Data - High-performance market data management for quantitative finance
# Independent package configuration for standalone distribution

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ml4t/data/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ml4t"]
namespaces = true

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts/verify_distribution.py",
    "/scripts/verify_provider_contract_runs.py",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[project]
name = "ml4t-data"
dynamic = ["version"]
description = "High-performance market data management library with unified multi-provider interface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ML4T Team", email = "info@ml4trading.io" },
]
maintainers = [
    { name = "ML4T Contributors", email = "dev@ml4trading.io" },
]
keywords = [
    "finance",
    "market-data",
    "trading",
    "backtesting",
    "quantitative-finance",
    "yahoo-finance",
    "binance",
    "cryptocompare",
    "databento",
    "oanda",
    "polars",
    "parquet",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
requires-python = ">=3.12,<3.15"

# Core dependencies
dependencies = [
    # Data processing
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # HTTP and networking
    "httpx>=0.25.0",
    "tenacity>=8.0.0",
    "pybreaker>=1.0.0", # Circuit breaker pattern
    # Configuration and CLI
    "pyyaml>=6.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.12,<3",
    # Utilities
    "structlog>=23.0.0",
    "platformdirs>=4.0.0",
    "filelock>=3.19.1",
    "rich>=13.0.0",
    "aiofiles>=23.0.0", # Async file I/O for async storage backends
    # Exchange calendars for session-aware operations
    "pandas-market-calendars>=4.3.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# Provider-specific dependencies
yahoo = [
    "yfinance>=0.2.0",
]
databento = [
    "databento>=0.38.0",
    "pyarrow>=14.0.0",
]
oanda = [
    "oandapyV20>=0.7.0",
    # oandapyV20 imports requests but does not declare it.
    "requests>=2.32.0",
]
cot = [
    "cot-reports>=0.1.0",  # CFTC Commitment of Traders data
]

all-providers = [
    "ml4t-data[yahoo,databento,oanda,cot]",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.1.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.80.0",
    "ruff>=0.1.0",
    "ty",
    "ipython>=8.14.0",
    "ipdb>=0.13.0",
    "pre-commit>=3.3.0",
    "xlsxwriter>=3.1.0",  # Excel export testing
    "oandapyV20>=0.7.0",  # OANDA provider tests/imports
]

# Documentation dependencies (MkDocs Material with Picasso theme)
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
]

# All optional dependencies
all = [
    "ml4t-data[all-providers,dev,docs]",
]

[project.scripts]
ml4t-data = "ml4t.data.cli_interface:cli"

[project.urls]
Homepage = "https://www.ml4trading.io/docs/data/"
Documentation = "https://www.ml4trading.io/docs/data/"
Repository = "https://github.com/ml4t/data"
Issues = "https://github.com/ml4t/data/issues"
Changelog = "https://github.com/ml4t/data/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.1.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.80.0",
    "ty",
    "xlsxwriter>=3.1.0",
    "oandapyV20>=0.7.0",
    "requests>=2.32.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.8.0",
    "pre-commit>=3.3.0",
    "twine>=6.0.0",
    "pip-audit>=2.10.1",
    "databento>=0.38.0",
    "yfinance>=0.2.0",
]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Default: deterministic/offline lane only
# Integration/API-key/paid-tier/optional-dependency tests run in explicit marker lanes
# NOTE: Parallel execution (-n auto) causes hangs - disabled by default
# Use: pytest -n auto  (to enable parallel execution manually)
addopts = [
    "-ra",
    "--strict-markers",
    "-m", "not slow and not paid_tier and not integration and not requires_api_key",
    "--tb=short",
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "paid_tier: marks tests requiring paid API tier (skipped by default)",
    "integration: marks tests as integration tests requiring external APIs",
    "real_api: marks tests that use real API calls (deprecated, use integration)",
    "requires_api_key: marks tests requiring specific API keys",
    "expensive: marks tests with high API costs",
    "network_guard_probe: exercises the offline network guard itself",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Timeout for tests (prevent hanging)
timeout = 300
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true
exclude = ["_version.py", "**/AGENTS.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
    "E402",  # module import not at top (common in notebooks)
    "SIM105",  # try-except-pass pattern (often clearer than contextlib.suppress)
    "SIM102",  # nested ifs (often clearer than complex and)
    "B904",  # exception chaining (not always needed)
]

[tool.ruff.lint.isort]
# Treat the whole ml4t namespace (data, engineer, evaluation, ...) as
# first-party so its imports always form their own third section after the
# standard library and third-party blocks, even for ml4t distributions
# installed from outside this repo.
known-first-party = ["ml4t"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "B017", "F821", "SIM117"]  # Test patterns
"src/ml4t/data/futures/continuous_downloader.py" = ["ARG002"]  # Public API placeholder
"src/ml4t/data/providers/base.py" = ["ARG002"]  # Template method pattern
"src/ml4t/data/validation/*.py" = ["ARG002"]  # Validator pattern
"src/ml4t/data/provider_updater.py" = ["ARG002"]  # Template pattern
"src/ml4t/data/cli_interface.py" = ["ARG001"]  # Click callback signature
"src/ml4t/data/export/formats/excel.py" = ["F401"]  # Conditional import
"provider_template/*" = ["ARG002", "F821"]  # Template placeholders
"examples/notebooks/*" = ["E402"]  # Jupyter notebooks

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.src]
include = ["src"]
exclude = ["tests", "examples", "benchmarks"]

[tool.ty.rules]
# Suppress common false positives from Polars type stubs and dynamic patterns
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
not-subscriptable = "ignore"
unresolved-import = "ignore"
invalid-assignment = "ignore"
unknown-argument = "ignore"
invalid-return-type = "ignore"
invalid-type-form = "ignore"
not-iterable = "ignore"
unused-type-ignore-comment = "ignore"
no-matching-overload = "ignore"
invalid-method-override = "ignore"
missing-argument = "ignore"

[tool.coverage.run]
source = ["src/ml4t/data"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]
