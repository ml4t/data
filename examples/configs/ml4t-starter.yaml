# ML4T Data starter configuration
# Run: ml4t-data update-all -c ml4t-starter.yaml

storage:
  strategy: hive
  base_path: ~/ml4t-data

providers:
  - name: yahoo
    type: yahoo

datasets:
  - name: demo_stocks
    provider: yahoo
    frequency: daily
    symbols: [AAPL, MSFT, GOOGL, JPM, XOM]

validation:
  enabled: true
  strict: false
