# Provider configurations
# Can be included by other configuration files

providers:
  # Free providers
  - name: yahoo
    type: yahoo
    rate_limit: 0.5

  - name: yahoo_fast
    type: yahoo
    rate_limit: 1.0  # Faster rate for smaller datasets

  # Crypto providers
  - name: binance_spot
    type: binance
    rate_limit: 10
    extra:
      market: spot

  - name: binance_futures
    type: binance
    rate_limit: 10
    extra:
      market: futures

  - name: cryptocompare
    type: cryptocompare
    api_key: ${CRYPTOCOMPARE_API_KEY}
    rate_limit: 2.0

  # Premium providers (require API keys)
  - name: massive
    type: massive
    api_key: ${POLYGON_API_KEY}
    rate_limit: 5.0

  # Development/testing
  - name: mock
    type: mock
    extra:
      seed: 42
