# Base configuration - shared settings
# This file is included by other configurations

version: "1.0"
base_dir: ${ML4T_DATA_PATH:./data}
log_level: ${ML4T_DATA_LOG_LEVEL:INFO}

# Common environment variables
env:
  ML4T_DATA_PATH: /var/lib/ml4t/data
  ML4T_DATA_REPORT_PATH: /var/log/ml4t-data
  ML4T_DATA_CACHE_PATH: /var/cache/ml4t-data

# Default settings for all datasets
defaults:
  update_mode: incremental
  asset_class: equity
  validation:
    enabled: true
    strict: false
    save_reports: true

# Global validation rules
validation:
  enabled: true
  fail_on_critical: false
  save_reports: true
  report_dir: ${ML4T_DATA_REPORT_PATH}/validation
  rules:
    check_nulls: true
    check_duplicate_timestamps: true
    check_chronological_order: true
    negative_price_policy: forbid
    check_negative_volume: true

# Storage configuration
storage:
  strategy: hive
  base_path: ${ML4T_DATA_PATH}
  compression: zstd
