# Production configuration using implemented ml4t-data settings.

version: "1.0"
base_dir: /var/lib/ml4t-data
log_level: INFO
parallel_downloads: 4

storage:
  strategy: hive
  base_path: /var/lib/ml4t-data/market-data
  compression: zstd
  atomic_writes: true
  metadata_tracking: true
  partition_granularity: month

providers:
  - name: yahoo
    type: yahoo
    enabled: true
    rate_limit:
      requests_per_second: 2
      burst_size: 1

datasets:
  - name: liquid_etfs
    provider: yahoo
    symbols: [SPY, QQQ, IWM]
    frequency: daily
    asset_class: etf
    update_mode: incremental
    lookback_days: 7
    initial_load_days: 3650

validation:
  enabled: true
  strict: true
